[build]
  command = "npm run build && cp -r dist-gym dist/gym"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

# Cross-Origin Isolation required for expo-sqlite (WASM + SharedArrayBuffer)
[[headers]]
  for = "/gym/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[redirects]]
  from = "/gym/*"
  to = "/gym/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
