[build]
  command = "npm run build && cp -r dist-gym dist/gym"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

# Cross-Origin Isolation required for expo-sqlite (WASM + SharedArrayBuffer)
[[headers]]
  for = "/gym/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/gym/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Passthrough for static assets under /gym/ — must come BEFORE SPA catch-all
[[redirects]]
  from = "/gym/_expo/*"
  to = "/gym/_expo/:splat"
  status = 200

[[redirects]]
  from = "/gym/assets/*"
  to = "/gym/assets/:splat"
  status = 200

[[redirects]]
  from = "/gym/*"
  to = "/gym/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
