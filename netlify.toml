[build]
  command = "npm run build && bash scripts/merge-gym-tracker.sh"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

[[redirects]]
  from = "/gym/*"
  to = "/gym/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
