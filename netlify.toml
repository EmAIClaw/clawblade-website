[build]
  command = "npm run test:all && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://sdk.scdn.co; worker-src 'self' blob:; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://*.spotify.com wss://*.spotify.com; img-src 'self' data: https:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cross-Origin Isolation required for expo-sqlite (WASM + SharedArrayBuffer).
# `require-corp` is supported by Safari as well as Chromium; `credentialless`
# leaves Safari pages non-isolated and causes expo-sqlite to fail at startup.
[[headers]]
  for = "/gym/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/gym/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Passthrough for static assets under /gym/ — must come BEFORE SPA catch-all
[[redirects]]
  from = "/gym/_expo/*"
  to = "/gym/_expo/:splat"
  status = 200

[[redirects]]
  from = "/gym/assets/*"
  to = "/gym/assets/:splat"
  status = 200

[[redirects]]
  from = "/assets/node_modules/expo-sqlite/*"
  to = "/gym/assets/node_modules/expo-sqlite/:splat"
  status = 200

[[redirects]]
  from = "/gym/*"
  to = "/gym/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
